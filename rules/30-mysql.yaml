version: "1"
rules:
  - id: mysql-mariadb
    protocol: MySQL
    product: MariaDB
    priority: 110
    confidence: 0.9
    patterns:
      - '(?s)^(?:\x0a|.{4}\x0a)5\.5\.5-(?P<version>[0-9]+\.[0-9]+\.[0-9]+).*MariaDB'

  - id: mysql-generic
    protocol: MySQL
    product: MySQL
    priority: 100
    confidence: 0.9
    patterns:
      - '(?s)^(?:\x0a|.{4}\x0a)(?P<version>[0-9]+\.[0-9]+\.[0-9]+)'
    examples:
      - banner: "\n8.0.32"
        port: 3306
        protocol: MySQL
        product: MySQL
        version: 8.0.32
