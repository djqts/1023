version: "1"
rules:
  - id: ftp-filezilla
    protocol: FTP
    product: FileZilla Server
    priority: 100
    confidence: 0.9
    patterns:
      - '(?im)^220[- ]FileZilla Server(?:\s+(?P<version>[0-9][^\s]*))?'
    examples:
      - banner: "220-FileZilla Server 1.5.1"
        port: 21
        protocol: FTP
        product: FileZilla Server
        version: 1.5.1

  - id: ftp-proftpd
    protocol: FTP
    product: ProFTPD
    priority: 100
    confidence: 0.9
    patterns:
      - '(?im)^220[ -]ProFTPD\s+(?P<version>[0-9][^\s]*)'
    examples:
      - banner: '220 ProFTPD 1.3.7 Server (ProFTPD)'
        port: 21
        protocol: FTP
        product: ProFTPD
        version: 1.3.7

  - id: ftp-vsftpd
    protocol: FTP
    product: vsFTPd
    priority: 100
    confidence: 0.85
    patterns:
      - '(?im)^220[ -]?\(vsFTPd\s+(?P<version>[0-9][^\)]*)'

  - id: ftp-pureftpd
    protocol: FTP
    product: Pure-FTPd
    priority: 90
    confidence: 0.85
    patterns:
      - '(?im)^220.*Pure-FTPd'

  - id: ftp-microsoft
    protocol: FTP
    product: Microsoft FTP Service
    priority: 90
    confidence: 0.85
    os_hint: Windows
    patterns:
      - '(?im)^220.*Microsoft FTP Service'
